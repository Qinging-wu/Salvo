<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Salvo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #05050d;
    overflow: hidden;
    font-family: 'Outfit', sans-serif;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(ellipse at 50% 0%, #1a1a2e 0%, #0a0a1a 45%, #05050d 100%);
  }
  #stage {
    position: relative;
    height: 100vh;
    aspect-ratio: 720 / 1280;
    max-width: 100vw;
    box-shadow: 0 0 80px rgba(120, 80, 255, 0.15), 0 0 0 1px rgba(255,255,255,0.04);
    border-radius: 4px;
    overflow: hidden;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
    cursor: crosshair;
  }
  /* Loading hint */
  #hint {
    position: absolute;
    bottom: 12px; left: 50%;
    transform: translateX(-50%);
    color: rgba(229,231,235,0.35);
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    pointer-events: none;
    font-weight: 500;
  }
</style>
</head>
<body>
  <div id="stage">
    <canvas id="game" width="720" height="1280"></canvas>
    <div id="hint">Drag to aim · Release to fire · ⏸ pause · ⏩ speed</div>
  </div>

<!--

   Scripts loaded in dependency order.

   which share the same global lexical scope.
  ============================================================
-->
<script src="js/config.js"></script>
<script src="js/canvas.js"></script>
<script src="js/utils.js"></script>
<script src="js/audio.js"></script>
<script src="js/game-state.js"></script>
<script src="js/ball-manager.js"></script>
<script src="js/brick-manager.js"></script>
<script src="js/collision.js"></script>
<script src="js/physics.js"></script>
<script src="js/particles.js"></script>
<script src="js/game-flow.js"></script>
<script src="js/input.js"></script>
<script src="js/renderer.js"></script>
<script src="js/main.js"></script>
</body>
</html>
